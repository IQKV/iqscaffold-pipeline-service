services:
  # PostgreSQL Database for Pipeline Service
  postgres-pipeline:
    extends:
      file: compose.base.yaml
      service: postgres-pipeline

  # Redis for Pipeline Service
  redis-pipeline:
    extends:
      file: compose.base.yaml
      service: redis-pipeline

  # RabbitMQ for Pipeline Service
  rabbitmq-pipeline:
    extends:
      file: compose.base.yaml
      service: rabbitmq-pipeline

  # Pipeline Service - Full platform run including build phase
  pipeline-service:
    extends:
      file: compose.base.yaml
      service: pipeline-service

networks:
  pipeline-service-network:
    name: iqscaffold-pipeline-network-dev
    external: false

volumes:
  postgres_pipeline_data:
    name: iqscaffold_pipeline_postgres_data_dev
  redis_pipeline_data:
    name: iqscaffold_pipeline_redis_data_dev
  rabbitmq_pipeline_data:
    name: iqscaffold_pipeline_rabbitmq_data_dev
  pipeline_logs:
    name: iqscaffold_pipeline_logs_dev
  pipeline_tmp:
    name: iqscaffold_pipeline_tmp_dev

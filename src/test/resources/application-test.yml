spring:
  main:
    allow-bean-definition-overriding: true
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        multiTenancy: NONE
        cache:
          use_second_level_cache: false
          use_query_cache: false
  
  cache:
    type: none
  
  liquibase:
    enabled: false
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://iqscaffold-user-service
          jwk-set-uri: http://iqscaffold-user-service/.well-known/jwks.json
  
  web:
    resources:
      add-mappings: false
  
  mvc:
    throw-exception-if-no-handler-found: false

iqscaffold:
  liquibase:
    system-schema:
      enabled: false
  bootstrap:
    default-tenant-schema:
      enabled: false

logging:
  level:
    root: INFO
    com.iqscaffold.pipelineservice: DEBUG

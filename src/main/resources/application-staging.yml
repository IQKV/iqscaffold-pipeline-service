# Staging Environment Configuration

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://staging-db:5432/iqscaffold_pipeline_staging}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    pool:
      maximum-size: 20
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:rabbitmq-staging}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

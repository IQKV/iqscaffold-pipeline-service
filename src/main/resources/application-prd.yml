# Production Environment Configuration

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    pool:
      maximum-size: 50
      minimum-idle: 10
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST}
      username: ${IQSCAFFOLD_MESSAGING_RABBITMQ_USERNAME}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
  
  liquibase:
    contexts: "!demo"

logging:
  level:
    root: WARN
    com.iqscaffold.pipelineservice: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

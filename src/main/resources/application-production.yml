spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Production environment overrides for IQ Scaffold properties
iqscaffold:
  liquibase:
    # Exclude demo context to prevent demo data in production
    contexts: "!demo"

logging:
  level:
    root: WARN
    com.iqscaffold.pipelineservice: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# SIT Profile Configuration
# This profile enables demo data for development and enhanced logging

iqscaffold:
  liquibase:
    contexts: "demo"
  
  # Pipeline Configuration - Development settings
  pipeline:
    enableAutoStageProgression: true  # Enable for testing
    enableFollowUpReminders: true
    enableActivityTracking: true
  
  # Follow-up Configuration - Development settings
  followup:
    overdueThresholdHours: 2  # Shorter threshold for dev testing
    reminderIntervalHours: 1
    maxFollowUpsPerLead: 20

logging:
  level:
    # Application logging
    com.iqscaffold.pipelineservice: DEBUG
    com.iqscaffold.pipelineservice.tenancy.TenantLiquibaseRunner: DEBUG
    com.iqscaffold.pipelineservice.scheduler: DEBUG
    com.iqscaffold.pipelineservice.followup: DEBUG
    
    # Spring Framework
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.scheduling: DEBUG
    
    # Database and JPA
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
    # Infrastructure
    liquibase: INFO
    com.zaxxer.hikari: INFO

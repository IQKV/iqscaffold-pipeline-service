spring:
  application:
    name: iqscaffold-pipeline-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  output:
    ansi:
      enabled: always
  datasource:
    url: ${iqscaffold.database.url}
    username: ${iqscaffold.database.username}
    password: ${iqscaffold.database.password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax:
          cache:
            provider: org.ehcache.jsr107.EhcacheCachingProvider
            uri: classpath:ehcache.xml
  
  # Liquibase Configuration
  # Disabled globally - migrations are run programmatically per schema via TenantLiquibaseRunner
  liquibase:
    enabled: false
  
  rabbitmq:
    host: ${iqscaffold.messaging.rabbitmq.host}
    port: ${iqscaffold.messaging.rabbitmq.port}
    username: ${iqscaffold.messaging.rabbitmq.username}
    password: ${iqscaffold.messaging.rabbitmq.password}
    virtual-host: ${iqscaffold.messaging.rabbitmq.virtual-host}
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 2.0
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://iqscaffold-user-service}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://iqscaffold-user-service/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
  http2:
    enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liquibase,openapi
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    liquibase:
      enabled: true
    prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${IQSCAFFOLD_OBSERVABILITY_TRACING_SAMPLING_RATE:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.iqscaffold.pipelineservice: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    liquibase: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

iqscaffold:
  tenant-id-header: ${IQSCAFFOLD_TENANT_ID_HEADER:X-Tenant-ID}
  
  # Database Configuration
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5436/iqscaffold_pipeline_local}
    username: ${IQSCAFFOLD_DATABASE_USERNAME:iqscaffold_pipeline}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD:iqscaffold_password}
    pool:
      maximum-size: 10
      minimum-idle: 5
      connection-timeout: PT30S
      idle-timeout: PT10M
      max-lifetime: PT30M
    migration:
      enabled: true
      contexts: ${IQSCAFFOLD_LIQUIBASE_CONTEXTS:}
      validate-on-migrate: true
  
  # Messaging Configuration
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:localhost}
      port: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PORT:5672}
      username: ${IQSCAFFOLD_MESSAGING_RABBITMQ_USERNAME:iqscaffold}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD:iqscaffold_password}
      virtual-host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_VHOST:/}
      connection-timeout: PT30S
      requested-heartbeat: PT60S
      publisher-confirms: true
      publisher-returns: true
  
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://iqscaffold-user-service/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:iqscaffold-user-service}
      secret-key: ${JWT_SECRET_KEY:change-me-in-production}
      algorithm: HS256
  observability:
    tracing:
      enabled: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENABLED:true}
      sampling-rate: ${IQSCAFFOLD_OBSERVABILITY_TRACING_SAMPLING_RATE:1.0}
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://localhost:4317}
  liquibase:
    # Changelog file paths
    systemChangeLog: classpath:db/changelog/system/master.xml
    tenantChangeLog: classpath:db/changelog/tenant/master.xml
    
    # Context filtering for migrations (comma-separated)
    # Empty = run all changesets, "demo" = include demo data, "!demo" = exclude demo data
    contexts: ${IQSCAFFOLD_LIQUIBASE_CONTEXTS:}
    
    # System schema initialization
    system-schema:
      enabled: true
  
  # Tenancy Configuration
  tenancy:
    schema:
      prefix: tenant_
      default: public
  
  # Bootstrap Configuration
  bootstrap:
    default-tenant-schema:
      enabled: true
      tenant-id: default
  
  pipeline:
    enable-auto-stage-progression: ${PIPELINE_ENABLE_AUTO_STAGE_PROGRESSION:false}
    enable-follow-up-reminders: ${PIPELINE_ENABLE_FOLLOW_UP_REMINDERS:true}
    enable-activity-tracking: ${PIPELINE_ENABLE_ACTIVITY_TRACKING:true}
  services:
    lead-service-url: ${LEAD_SERVICE_URL:http://lead-service}
